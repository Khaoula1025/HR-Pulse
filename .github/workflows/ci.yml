name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Linting ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff (linting)
        run: uv run ruff check backend/

  # ── Job 2: Unit Tests ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Pytest
        run: uv run pytest backend/tests/ -v
        env:
          DATABASE_URL: "mssql+pyodbc://fake:fake@fake/fake?driver=ODBC+Driver+18+for+SQL+Server"
          SECRET_KEY: "test-secret-key"
          MODEL_PATH: "models/salary_model.pkl"

  # ── Job 3: Docker Build ─────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend image
        run: docker build -t hr-pulse-backend:ci -f backend/Dockerfile .

      - name: Build Frontend image
        run: docker build -t hr-pulse-frontend:ci ./frontend